name: HDLab benachrichtigen

# Stößt nach jeder Änderung am Tutorial den Sync-Workflow in HDLab an
# (TrainWayne97/HDLab -> .github/workflows/sync-ES1.yml), damit die
# Änderung sofort statt erst beim nächtlichen Lauf online geht.
on:
  push:
    branches: [main]
    paths:
      - "ES1Tutorial.md"
      - "images/**"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      # Benötigt das Secret HDLAB_DISPATCH_TOKEN: Fine-grained Personal
      # Access Token mit Zugriff auf TrainWayne97/HDLab, Berechtigung
      # "Contents: Read and write".
      - name: Trigger HDLab sync
        env:
          TOKEN: ${{ secrets.HDLAB_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret HDLAB_DISPATCH_TOKEN fehlt - HDLab wurde nicht benachrichtigt."
            exit 1
          fi
          status=$(curl -s -o response.txt -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/TrainWayne97/HDLab/dispatches \
            -d '{"event_type":"es1-tutorial-updated","client_payload":{"sha":"${{ github.sha }}"}}')
          if [ "$status" != "204" ]; then
            echo "::error::Dispatch fehlgeschlagen (HTTP $status)"
            cat response.txt
            exit 1
          fi
          echo "HDLab-Sync ausgelöst."
