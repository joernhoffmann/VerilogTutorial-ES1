<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="534pt" height="320pt" viewBox="0 0 534 320" role="img" aria-labelledby="title desc">
  <title id="title">Logische Gatter – US-/ANSI-Symbole</title>
  <desc id="desc">AND, OR, XOR, NOT, NAND und NOR mit Eingängen a und b, Ausgang y und zugehörigen Ausdrücken. Ein Kreis am Ausgang kennzeichnet die Invertierung.</desc>
  <rect width="534" height="320" fill="white" />
  <g transform="translate(12 12)" font-family="DejaVu Sans" fill="#263446">
    <text x="255" y="14" text-anchor="middle" font-size="13" fill="#263446" font-family="DejaVu Sans">Logische Gatter · US-/ANSI-Symbole</text>
    <text x="85" y="50" text-anchor="middle" font-size="11" fill="#263446" font-family="DejaVu Sans">AND</text>
    <g transform="translate(59 62)" stroke="#263446" stroke-width="1.2" stroke-linejoin="round" fill="white">
      <path d="M0 0 H30 C42 0 52 10 52 22 C52 34 42 44 30 44 H0 Z" />
      <path d="M-20 12 H0 M-20 32 H0 M52 22 H80" fill="none" />
    </g>
    <text x="23" y="78" text-anchor="middle" font-size="9" fill="#263446" font-family="DejaVu Sans">a</text>
    <text x="23" y="98" text-anchor="middle" font-size="9" fill="#263446" font-family="DejaVu Sans">b</text>
    <text x="153" y="88" text-anchor="middle" font-size="9" fill="#263446" font-family="DejaVu Sans">y</text>
    <text x="85" y="133" text-anchor="middle" font-size="8" fill="#263446" font-family="DejaVu Sans Mono">y = a &amp; b</text>
    <text x="255" y="50" text-anchor="middle" font-size="11" fill="#263446" font-family="DejaVu Sans">OR</text>
    <g transform="translate(229 62)" stroke="#263446" stroke-width="1.2" stroke-linejoin="round" fill="white">
      <path d="M0 0 Q32 0 52 22 Q32 44 0 44 Q20 22 0 0 Z" />
      <path d="M-20 12 H7.934 M-20 32 H7.934 M52 22 H80" fill="none" />
    </g>
    <text x="193" y="78" text-anchor="middle" font-size="9" fill="#263446" font-family="DejaVu Sans">a</text>
    <text x="193" y="98" text-anchor="middle" font-size="9" fill="#263446" font-family="DejaVu Sans">b</text>
    <text x="323" y="88" text-anchor="middle" font-size="9" fill="#263446" font-family="DejaVu Sans">y</text>
    <text x="255" y="133" text-anchor="middle" font-size="8" fill="#263446" font-family="DejaVu Sans Mono">y = a | b</text>
    <text x="425" y="50" text-anchor="middle" font-size="11" fill="#263446" font-family="DejaVu Sans">XOR</text>
    <g transform="translate(399 62)" stroke="#263446" stroke-width="1.2" stroke-linejoin="round" fill="white">
      <path d="M0 0 Q32 0 52 22 Q32 44 0 44 Q20 22 0 0 Z" />
      <path d="M-6 0 Q14 22 -6 44" fill="none" />
      <path d="M-20 12 H7.934 M-20 32 H7.934 M52 22 H80" fill="none" />
    </g>
    <text x="363" y="78" text-anchor="middle" font-size="9" fill="#263446" font-family="DejaVu Sans">a</text>
    <text x="363" y="98" text-anchor="middle" font-size="9" fill="#263446" font-family="DejaVu Sans">b</text>
    <text x="493" y="88" text-anchor="middle" font-size="9" fill="#263446" font-family="DejaVu Sans">y</text>
    <text x="425" y="133" text-anchor="middle" font-size="8" fill="#263446" font-family="DejaVu Sans Mono">y = a ^ b</text>
    <text x="85" y="175" text-anchor="middle" font-size="11" fill="#263446" font-family="DejaVu Sans">NOT</text>
    <g transform="translate(59 187)" stroke="#263446" stroke-width="1.2" stroke-linejoin="round" fill="white">
      <path d="M0 0 L44 22 L0 44 Z" />
      <circle cx="48" cy="22" r="4" />
      <path d="M-20 22 H0 M52 22 H80" fill="none" />
    </g>
    <text x="23" y="213" text-anchor="middle" font-size="9" fill="#263446" font-family="DejaVu Sans">a</text>
    <text x="153" y="213" text-anchor="middle" font-size="9" fill="#263446" font-family="DejaVu Sans">y</text>
    <text x="85" y="258" text-anchor="middle" font-size="8" fill="#263446" font-family="DejaVu Sans Mono">y = ~a</text>
    <text x="255" y="175" text-anchor="middle" font-size="11" fill="#263446" font-family="DejaVu Sans">NAND</text>
    <g transform="translate(229 187)" stroke="#263446" stroke-width="1.2" stroke-linejoin="round" fill="white">
      <path d="M0 0 H30 C42 0 52 10 52 22 C52 34 42 44 30 44 H0 Z" />
      <circle cx="56" cy="22" r="4" />
      <path d="M-20 12 H0 M-20 32 H0 M60 22 H80" fill="none" />
    </g>
    <text x="193" y="203" text-anchor="middle" font-size="9" fill="#263446" font-family="DejaVu Sans">a</text>
    <text x="193" y="223" text-anchor="middle" font-size="9" fill="#263446" font-family="DejaVu Sans">b</text>
    <text x="323" y="213" text-anchor="middle" font-size="9" fill="#263446" font-family="DejaVu Sans">y</text>
    <text x="255" y="258" text-anchor="middle" font-size="8" fill="#263446" font-family="DejaVu Sans Mono">y = ~(a &amp; b)</text>
    <text x="425" y="175" text-anchor="middle" font-size="11" fill="#263446" font-family="DejaVu Sans">NOR</text>
    <g transform="translate(399 187)" stroke="#263446" stroke-width="1.2" stroke-linejoin="round" fill="white">
      <path d="M0 0 Q32 0 52 22 Q32 44 0 44 Q20 22 0 0 Z" />
      <circle cx="56" cy="22" r="4" />
      <path d="M-20 12 H7.934 M-20 32 H7.934 M60 22 H80" fill="none" />
    </g>
    <text x="363" y="203" text-anchor="middle" font-size="9" fill="#263446" font-family="DejaVu Sans">a</text>
    <text x="363" y="223" text-anchor="middle" font-size="9" fill="#263446" font-family="DejaVu Sans">b</text>
    <text x="493" y="213" text-anchor="middle" font-size="9" fill="#263446" font-family="DejaVu Sans">y</text>
    <text x="425" y="258" text-anchor="middle" font-size="8" fill="#263446" font-family="DejaVu Sans Mono">y = ~(a | b)</text>
    <text x="255" y="290" text-anchor="middle" font-size="9" fill="#64748b" font-family="DejaVu Sans">Kreis am Ausgang: Invertierung · XOR hier mit zwei Eingängen</text>
  </g>
</svg>